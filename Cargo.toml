[package]
name = "libmobile"
version = "0.2.5"
edition = "2024"
description = "Extended NativeActivity framework for Rust on Android: Kotlin plugin bridges, compile-time plugin registry, non-blocking worker channels"
license = "MIT OR Apache-2.0"
readme = "README.md"
build = "build.rs"
# Not a native library: `links` is what lets this build script hand the
# staged Kotlin root and `libmobile.gradle` to the app's build script as
# `DEP_LIBMOBILE_*` (see `libmobile::gradle`).
links = "libmobile"
# The Kotlin sources ship with the crate: build.rs stages the ones the active
# features select into the Gradle handoff directory.
include = [
    "src/**",
    "android/java/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
default = []
# Native Sign in with Google over Credential Manager
# (android/java/dev/highbay/libmobile/auth, src/android/auth.rs). Also adds the
# androidx.credentials + googleid AARs to the generated Gradle script.
google-auth = []
# Photo capture through the system camera app
# (android/java/dev/highbay/libmobile/camera, src/android/camera.rs).
camera = []
# A foreground service with a notification, controlled from Rust on any
# thread (android/java/dev/highbay/libmobile/service, src/android/service.rs).
# Declare it with `gradle::Project::foreground_service`.
foreground-service = []
# Battery optimization and app sleeping: the exemption dialog, the settings
# pages and the state (android/java/dev/highbay/libmobile/battery,
# src/android/battery.rs). With `system-events`, `SystemEvent::BatteryExemption`.
battery = []
# System events for the app's own threads, from any thread, with no async
# runtime (android/java/dev/highbay/libmobile/events, src/system_events.rs):
# visibility, focus, the service, the default network and Doze.
system-events = []
# `system_events::subscribe_tokio`, a tokio receiver for system events.
tokio = ["system-events", "dep:tokio"]
# cpal, re-exported as `libmobile::android::cpal` (AAudio output and
# input). No Kotlin plugin. Also ndk's AAudio API (`ndk::audio`), with
# the API 28 calls for input presets cpal cannot set (libmorph's capture
# modes); generated projects target API 29.
cpal = ["dep:cpal", "ndk/audio", "ndk/api-level-28"]
# Create the secure store's Keystore key in the TEE only, never StrongBox
# (src/android/secure_store.rs). Negative so that turning off default
# features cannot turn off a security feature; app crates only.
secure-store-no-strongbox = []
# `key_store::Vault::memory()`, an in-memory vault for tests only. Normal
# app builds do not have it.
test-vault = []
# `gradle::Icon` and `Project::icon`: launcher icons made from PNGs into
# Android resources by the app's build script. Host only: it adds the
# `image` crate (PNG only) to the build-dependency copy of libmobile.
icons = ["dep:image"]

[lib]
# An rlib: the consuming app's own crate is the cdylib (`android_main`), and
# this crate's `Java_dev_highbay_libmobile_*` JNI exports are linked into it.
crate-type = ["lib"]

[dependencies]
log = "0.4"
# Clears key material the key store holds (`key_store`).
zeroize = { version = "1.8", features = ["derive"] }
# `system_events::subscribe_tokio` (feature `tokio`): an unbounded channel only.
tokio = { version = "1", default-features = false, features = ["sync"], optional = true }
# Decoding, scaling and encoding launcher icons (`gradle::Icon`, feature `icons`).
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
# Not a direct API dependency: turns ON ndk's `rwh_06` feature, which is what
# implements `raw_window_handle::HasWindowHandle` for `NativeWindow` and lets
# `surface::SurfaceTarget` hand a renderer a safe window handle.
# android-activity itself depends on ndk with `default-features = false`.
ndk = { version = "0.9", default-features = false, features = ["nativewindow", "rwh_06"] }
raw-window-handle = "0.6"
# Pinned to the same 0.22 android-activity resolves, so there is a single
# `JavaVM` singleton in the process.
jni = "0.22"
# The JavaVM and the Application, which android-activity registers once per
# process: the secure store reaches Keystore and its files through them, from
# any thread and without an activity. Shares android-activity's copy.
ndk-context = "0.1"
cpal = { version = "0.18.2", optional = true }

[workspace]
members = [".", "examples/bitmap", "examples/wgpu", "examples/audiocapture", "examples/securestore", "examples/background"]
